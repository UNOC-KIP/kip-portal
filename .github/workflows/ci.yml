name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs deploy.yml, which repeats these checks

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:build
      - run: pnpm typecheck
      - run: pnpm test
